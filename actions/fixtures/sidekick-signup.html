<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Robotics Club - Sign up</title>
<style>body{font:16px system-ui;max-width:520px;margin:48px auto;padding:0 16px}label,input,button{display:block;margin:8px 0}input{padding:8px;width:100%}button{padding:10px 16px}</style></head>
<body>
  <h1>Robotics Club sign-up</h1>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <button type="submit">Submit sign-up</button>
  </form>
  <p id="result" hidden>You are signed up.</p>
  <script>
    document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); e.target.hidden = true; document.getElementById("result").hidden = false; });
  </script>
</body>
</html>
