<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Engineering Internship - Acme Robotics</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1c1e21; margin: 0; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #5f6368; margin: 0 0 18px; font-size: 14px; }
  .row { margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  label, legend { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .req { color: #c62828; }
  input[type=text], input[type=email], input[type=tel], input[type=url], select, textarea {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c4c7cc; border-radius: 6px; font: inherit; }
  textarea { min-height: 120px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  .opt { font-weight: 400; display: block; margin: 2px 0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid #1a56db; background: #1a56db; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #1a56db; }
  [hidden] { display: none !important; }
  #confirmation { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main id="app">
  <h1>Software Engineering Internship, Summer 2027</h1>
  <p class="sub">Acme Robotics &middot; <span id="step">Step 1 of 2</span></p>

  <form id="application" novalidate>
    <section id="page1" class="page">
      <div class="grid">
        <div class="row"><label for="firstName">First name <span class="req">*</span></label>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" required></div>
        <div class="row"><label for="lastName">Last name <span class="req">*</span></label>
          <input type="text" id="lastName" name="lastName" autocomplete="family-name" required></div>
      </div>
      <div class="row"><label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" required></div>
      <div class="row"><label for="phone">Phone number <span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" required></div>
      <div class="row"><label for="school">School / University <span class="req">*</span></label>
        <input type="text" id="school" name="school" required></div>
      <div class="grid">
        <div class="row"><label for="major">Major <span class="req">*</span></label>
          <input type="text" id="major" name="major" required></div>
        <div class="row"><label for="gpa">GPA <span class="req">*</span></label>
          <input type="text" id="gpa" name="gpa" inputmode="decimal" required></div>
      </div>
      <div class="row"><label for="gradYear">Expected graduation year <span class="req">*</span></label>
        <select id="gradYear" name="gradYear" required>
          <option value="">Select a year</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
        </select></div>
      <div class="actions"><button type="button" id="nextBtn">Next</button></div>
    </section>

    <section id="page2" class="page" hidden>
      <div class="row"><label for="linkedin">LinkedIn profile URL</label>
        <input type="url" id="linkedin" name="linkedin"></div>
      <div class="row"><label for="github">GitHub profile URL</label>
        <input type="url" id="github" name="github"></div>
      <fieldset id="workAuthGroup">
        <legend>Work authorization <span class="req">*</span></legend>
        <label class="opt" for="workAuth1"><input type="radio" id="workAuth1" name="workAuth" value="authorized" required> Authorized to work in the US</label>
        <label class="opt" for="workAuth2"><input type="radio" id="workAuth2" name="workAuth" value="sponsorship"> Will require visa sponsorship</label>
        <label class="opt" for="workAuth3"><input type="radio" id="workAuth3" name="workAuth" value="unsure"> Not sure</label>
      </fieldset>
      <div class="row"><label for="hearAbout">How did you hear about us?</label>
        <select id="hearAbout" name="hearAbout">
          <option value="">Select one</option>
          <option value="career_fair">Career fair</option>
          <option value="linkedin">LinkedIn</option>
          <option value="friend">Friend or classmate</option>
          <option value="professor">Professor</option>
          <option value="other">Other</option>
        </select></div>
      <div class="row"><label for="resume">Resume (PDF) <span class="req">*</span></label>
        <input type="file" id="resume" name="resume" accept=".pdf,application/pdf" required></div>
      <div class="row"><label for="whyCompany">Why this company? <span class="req">*</span></label>
        <textarea id="whyCompany" name="whyCompany" required></textarea></div>
      <div class="row"><label for="reference">Reference name and email <span class="req">*</span></label>
        <input type="text" id="reference" name="reference" required></div>
      <div class="actions">
        <button type="button" class="secondary" id="backBtn">Back</button>
        <button type="submit" id="submitBtn">Submit application</button>
      </div>
    </section>
  </form>
</main>

<script>
  (function () {
    var form = document.getElementById('application');
    var page1 = document.getElementById('page1');
    var page2 = document.getElementById('page2');
    var step = document.getElementById('step');

    function pageValid(page) {
      var controls = page.querySelectorAll('input, select, textarea');
      for (var i = 0; i < controls.length; i++) {
        if (!controls[i].checkValidity()) { controls[i].reportValidity(); return false; }
      }
      return true;
    }
    function show(n) {
      page1.hidden = n !== 1;
      page2.hidden = n !== 2;
      step.textContent = 'Step ' + n + ' of 2';
    }
    document.getElementById('nextBtn').addEventListener('click', function () {
      if (pageValid(page1)) show(2);
    });
    document.getElementById('backBtn').addEventListener('click', function () { show(1); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!pageValid(page1)) { show(1); return; }
      if (!pageValid(page2)) return;
      var name = form.elements.firstName.value + ' ' + form.elements.lastName.value;
      var app = document.getElementById('app');
      app.innerHTML = '';
      var box = document.createElement('div');
      box.id = 'confirmation';
      var h = document.createElement('h1');
      h.textContent = 'Application submitted';
      var p = document.createElement('p');
      p.textContent = 'Thank you, ' + name + '. We received your application for the Software Engineering Internship.';
      box.appendChild(h); box.appendChild(p);
      app.appendChild(box);
    });
  })();
</script>
</body>
</html>
