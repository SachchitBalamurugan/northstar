<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email preferences - Campus Deals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; color: #1f2430; }
  main { max-width: 520px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-top: 0; }
  label { display: block; margin: 10px 0; }
  button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; margin-right: 8px; }
  #unsubscribe-btn { background: #c0392b; color: #fff; }
  #keep-btn { background: #e3e6ec; }
  #result { margin-top: 20px; padding: 12px; background: #e6f6ea; border-radius: 8px; color: #1d6b34; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Campus Deals email preferences</h1>
  <p>You are receiving the weekly <strong>Campus Deals</strong> newsletter at <span id="email">maya.chen@example.edu</span>.</p>
  <label><input type="checkbox" id="weekly" checked> Weekly deals digest</label>
  <label><input type="checkbox" id="partners" checked> Partner offers</label>
  <p>
    <button type="button" id="unsubscribe-btn">Unsubscribe</button>
    <button type="button" id="keep-btn">Keep me subscribed</button>
  </p>
  <div id="result" role="status" hidden>You have been unsubscribed</div>
</main>
<script>
  document.getElementById("unsubscribe-btn").addEventListener("click", function () {
    document.getElementById("weekly").checked = false;
    document.getElementById("partners").checked = false;
    document.getElementById("result").hidden = false;
    this.disabled = true;
  });
</script>
</body>
</html>
