<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advising Appointment Request - College of Engineering</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1c1e21; margin: 0; padding: 24px 16px; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #5f6368; margin: 0 0 18px; font-size: 14px; }
  .row { margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .req { color: #c62828; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c4c7cc; border-radius: 6px; font: inherit; }
  textarea { min-height: 90px; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid #1a56db; background: #1a56db; color: #fff; cursor: pointer; }
  [hidden] { display: none !important; }
  #confirmation { text-align: center; padding: 40px 0; }
  #error { color: #c62828; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Request an advising appointment</h1>
  <p class="sub">College of Engineering Advising Office. We reply within one business day.</p>

  <form id="appointment" novalidate>
    <div class="row"><label for="fullName">Full name <span class="req">*</span></label>
      <input type="text" id="fullName" name="fullName" autocomplete="name" required></div>
    <div class="row"><label for="studentId">Student ID number <span class="req">*</span></label>
      <input type="text" id="studentId" name="studentId" inputmode="numeric" required></div>
    <div class="row"><label for="email">University email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required></div>
    <div class="row"><label for="major">Major <span class="req">*</span></label>
      <input type="text" id="major" name="major" required></div>
    <div class="row"><label for="preferredDate">Preferred date</label>
      <input type="date" id="preferredDate" name="preferredDate"></div>
    <div class="row"><label for="timeSlot">Preferred time slot</label>
      <select id="timeSlot" name="timeSlot">
        <option value="">No preference</option>
        <option value="morning">Morning (9:00 to 12:00)</option>
        <option value="early-afternoon">Early afternoon (12:00 to 2:00)</option>
        <option value="late-afternoon">Late afternoon (2:00 to 5:00)</option>
      </select></div>
    <div class="row"><label for="reason">Reason for appointment</label>
      <textarea id="reason" name="reason" placeholder="For example: course planning, add/drop, graduation check"></textarea></div>
    <p id="error" hidden>Please fill in every required field.</p>
    <button type="submit" id="submitBtn">Request appointment</button>
  </form>

  <div id="confirmation" hidden>
    <h2>Request received</h2>
    <p>Thank you. Your appointment request has been submitted.</p>
  </div>
</main>
<script>
  const form = document.getElementById("appointment");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const ok = form.checkValidity();
    document.getElementById("error").hidden = ok;
    if (!ok) return;
    form.hidden = true;
    document.getElementById("confirmation").hidden = false;
  });
</script>
</body>
</html>
