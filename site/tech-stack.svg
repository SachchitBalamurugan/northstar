<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Satoshi, Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6E6E76"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E26D45"/>
    </marker>
    <radialGradient id="bloom" cx="0.15" cy="0" r="0.7">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.9" cy="0" r="0.6">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <style>
      .box { fill: #0B0B0D; stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .hero { fill: #0B0B0D; stroke: #E26D45; stroke-width: 1.4; }
      .ext { fill: #141416; stroke: rgba(255,255,255,0.10); stroke-width: 1; stroke-dasharray: 4 3; }
      .t { fill: #FFFFFF; font-size: 15px; font-weight: 600; }
      .s { fill: #A5A5AD; font-size: 11.5px; }
      .tag { fill: #E26D45; font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; }
      .lbl { fill: #6E6E76; font-size: 10.5px; }
      .line { stroke: #6E6E76; stroke-width: 1.3; fill: none; }
      .lineA { stroke: #E26D45; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="640" fill="#000"/>
  <rect width="1100" height="640" fill="url(#bloom)"/>
  <rect width="1100" height="640" fill="url(#bloom2)"/>

  <!-- Title -->
  <text x="40" y="48" fill="#FFFFFF" font-size="24" font-weight="600" letter-spacing="-0.6">Northstar · tech stack</text>
  <text x="40" y="70" class="s">Windows desktop app + three local services. Everything runs on your machine; nothing acts without your approval.</text>

  <!-- User -->
  <rect x="40" y="250" width="120" height="70" rx="14" class="ext"/>
  <text x="100" y="280" text-anchor="middle" class="t">You</text>
  <text x="100" y="298" text-anchor="middle" class="s">click · Ctrl+Space</text>

  <!-- Desktop app -->
  <rect x="200" y="200" width="250" height="170" rx="18" class="hero"/>
  <text x="220" y="226" class="tag">DESKTOP APP</text>
  <text x="220" y="250" class="t">Electron + React 19</text>
  <text x="220" y="272" class="s">Vite · TypeScript · Tailwind v4</text>
  <text x="220" y="290" class="s">framer-motion · Three.js orb · zustand</text>
  <text x="220" y="316" class="s">Windows: main app · floating orb</text>
  <text x="220" y="334" class="s">camera notch · tray · toasts</text>
  <text x="220" y="356" fill="#E26D45" font-size="11.5">Approve: every action waits for you</text>

  <!-- Services -->
  <rect x="520" y="100" width="290" height="120" rx="18" class="box"/>
  <text x="540" y="126" class="tag">MEMORY  :7701</text>
  <text x="540" y="150" class="t">Python · FastAPI</text>
  <text x="540" y="171" class="s">SQLite · Knowledge .md · Universal Memory</text>
  <text x="540" y="189" class="s">Insights · Discover · Jobs · Briefing</text>
  <text x="540" y="207" class="s">profile.md + linkedin.md context</text>

  <rect x="520" y="250" width="290" height="120" rx="18" class="box"/>
  <text x="540" y="276" class="tag">INBOX  :7702</text>
  <text x="540" y="300" class="t">Node · TypeScript · Fastify</text>
  <text x="540" y="321" class="s">Triage · reply drafts · inbox briefing</text>
  <text x="540" y="339" class="s">Follow-ups · email compose · calendar</text>
  <text x="540" y="357" class="s">googleapis · zod</text>

  <rect x="520" y="400" width="290" height="120" rx="18" class="box"/>
  <text x="540" y="426" class="tag">ACTIONS  :7703</text>
  <text x="540" y="450" class="t">Node · TypeScript · Playwright</text>
  <text x="540" y="471" class="s">Application auto-fill · Sidekick tasks</text>
  <text x="540" y="489" class="s">LinkedIn import · tab reuse</text>
  <text x="540" y="507" class="s">pauses before every submit</text>

  <!-- External -->
  <rect x="880" y="110" width="180" height="60" rx="14" class="ext"/>
  <text x="970" y="137" text-anchor="middle" class="t">OpenAI API</text>
  <text x="970" y="155" text-anchor="middle" class="s">LLM + web research</text>

  <rect x="880" y="255" width="180" height="50" rx="14" class="ext"/>
  <text x="970" y="285" text-anchor="middle" class="t">Gmail API</text>

  <rect x="880" y="320" width="180" height="50" rx="14" class="ext"/>
  <text x="970" y="350" text-anchor="middle" class="t">Google Calendar API</text>

  <rect x="880" y="420" width="180" height="70" rx="14" class="ext"/>
  <text x="970" y="448" text-anchor="middle" class="t">Your Chrome</text>
  <text x="970" y="466" text-anchor="middle" class="s">signed-in, over CDP</text>

  <!-- You -> App -->
  <path d="M160 285 L198 285" class="lineA" marker-end="url(#arrowA)"/>

  <!-- App -> services (HTTP/JSON) -->
  <path d="M450 245 C485 245 485 160 518 160" class="line" marker-end="url(#arrow)"/>
  <path d="M450 285 L518 310" class="line" marker-end="url(#arrow)"/>
  <path d="M450 330 C485 330 485 460 518 460" class="line" marker-end="url(#arrow)"/>
  <text x="372" y="190" class="lbl">HTTP / JSON →</text>

  <!-- Inbox/Actions -> Memory (context + events) -->
  <path d="M800 250 L800 222" class="line" marker-end="url(#arrow)"/>
  <path d="M818 400 C850 380 850 230 812 215" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="239" class="lbl">context · events ↑</text>

  <!-- Services -> externals -->
  <path d="M810 150 L878 142" class="line" marker-end="url(#arrow)"/>
  <path d="M810 290 L878 282" class="line" marker-end="url(#arrow)"/>
  <path d="M810 330 L878 343" class="line" marker-end="url(#arrow)"/>
  <path d="M810 300 C850 300 850 170 880 160" class="line" marker-end="url(#arrow)"/>
  <path d="M810 460 L878 455" class="line" marker-end="url(#arrow)"/>

  <!-- Proposals back to Approve -->
  <path d="M520 520 C330 600 300 420 330 372" class="lineA" stroke-dasharray="5 4" marker-end="url(#arrowA)"/>
  <text x="300" y="585" fill="#E26D45" font-size="11">drafts &amp; applications return as proposals → you approve</text>
</svg>
